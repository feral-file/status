name: publish-npm

# Publishes @feralfile/keep (cli/) when a GitHub release is published.
# Auth is npm OIDC trusted publishing (same pattern as @feralfile/play and
# @feralfile/cli): configure the trusted publisher for @feralfile/keep on
# npmjs.org to point at this repo + this workflow file, environment blank.
#
# First release only: the trusted publisher cannot be configured before the
# package exists (npm/cli#8544), so cut the first release with an NPM_TOKEN
# repo secret (granular automation token with publish rights on the
# @feralfile scope). Then wire the trusted publisher on the package's npm
# settings page and delete the secret — the publish step below prefers OIDC
# when no token is present.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token used by `npm publish --provenance` to authenticate against
      # the trusted publisher configured for @feralfile/keep on npmjs.org.
      id-token: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships with npm 11.x, which is required for OIDC trusted
      # publishing. Consumers only need Node >= 18.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify package version matches tag
        run: |
          set -euo pipefail

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ github.event.release.tag_name }}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json is $PACKAGE_VERSION but tag is $TAG_VERSION."
            echo "Before cutting a release, set cli/package.json version to the exact tag."
            exit 1
          fi

          echo "Version check passed: package.json and tag are both $PACKAGE_VERSION."

      - name: Sanity check
        run: |
          set -euo pipefail
          node --check bin/keep.js
          node bin/keep.js --help > /dev/null

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")

          # Idempotent: re-running a release for an already-published version
          # verifies instead of failing.
          if npm view "@feralfile/keep@${VERSION}" version > /dev/null 2>&1; then
            echo "@feralfile/keep@${VERSION} is already published; skipping."
            exit 0
          fi

          # Bootstrap path (see header comment): first publish authenticates
          # with the NPM_TOKEN secret; once the trusted publisher is wired,
          # delete the secret and publishes use OIDC with no workflow change.
          if [ -n "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN secret present: publishing with token auth (bootstrap path)."
            export NODE_AUTH_TOKEN="${NPM_TOKEN}"
          else
            echo "No NPM_TOKEN secret: publishing via OIDC trusted publishing."
          fi

          npm publish --access public --provenance

      - name: Verify npm package version
        run: |
          set -euo pipefail

          TAG="${{ github.event.release.tag_name }}"
          ATTEMPTS=10
          SLEEP_SECONDS=10

          for attempt in $(seq 1 "$ATTEMPTS"); do
            NPM_VERSION=$(npm view @feralfile/keep version 2>/dev/null || echo "unpublished")
            if [ "$NPM_VERSION" = "$TAG" ]; then
              echo "npm version check passed: $NPM_VERSION"
              exit 0
            fi

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "npm version is $NPM_VERSION, expected $TAG; retrying in ${SLEEP_SECONDS}s (${attempt}/${ATTEMPTS})"
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "npm version check failed: expected $TAG"
          exit 1
